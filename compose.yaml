name: evejs

services:
  init:
    image: evejs-local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["init"]
    volumes:
      - evejs-data:/var/lib/evejs
    restart: "no"

  market-tools:
    image: evejs-local
    pull_policy: never
    profiles: ["tools"]
    entrypoint:
      - /usr/bin/tini
      - -g
      - --
      - /app/docker/entrypoint.sh
      - market-tools
    command: ["help"]
    volumes:
      - evejs-data:/var/lib/evejs
    restart: "no"

  content-tools:
    image: evejs-local
    pull_policy: never
    profiles: ["tools"]
    entrypoint:
      - /usr/bin/tini
      - -g
      - --
      - /app/docker/entrypoint.sh
      - content-tools
    command: ["help"]
    volumes:
      - evejs-data:/var/lib/evejs
    restart: "no"

  # Offline maintenance against the game database in the evejs-data volume,
  # such as the one-time sovereignty reset the updater runs after an update.
  maintenance:
    image: evejs-local
    pull_policy: never
    profiles: ["tools"]
    entrypoint:
      - /usr/bin/tini
      - -g
      - --
      - /app/docker/entrypoint.sh
      - maintenance
    command: ["help"]
    volumes:
      - evejs-data:/var/lib/evejs
    restart: "no"

  market:
    image: evejs-local
    pull_policy: never
    command: ["market"]
    depends_on:
      init:
        condition: service_completed_successfully
    volumes:
      - evejs-data:/var/lib/evejs
    ports:
      - "127.0.0.1:40110:40110"
      # The RPC port is published so a game server running on the host (outside
      # Docker) can reach the same market daemon the containerised server talks
      # to over the compose network. Loopback-only, like every other publication.
      - "127.0.0.1:40111:40111"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:40110/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    stop_grace_period: 30s

  server:
    image: evejs-local
    pull_policy: never
    command: ["server"]
    depends_on:
      market:
        condition: service_healthy
    environment:
      EVEJS_GAMESTORE_DATA_DIR: /var/lib/evejs/gameStore/data
      EVEJS_GAME_SERVER_BIND_HOST: 0.0.0.0
      EVEJS_SERVER_PORT: ${EVEJS_SERVER_PORT:-26000}
      EVEJS_IMAGE_SERVER_BIND_HOST: 0.0.0.0
      EVEJS_IMAGE_SERVER_URL: "${EVEJS_IMAGE_SERVER_URL:-http://127.0.0.1:${EVEJS_IMAGE_SERVER_PORT:-26001}/}"
      EVEJS_MARKET_DAEMON_HOST: market
      EVEJS_MARKET_DAEMON_PORT: "40111"
      EVEJS_MICROSERVICES_BIND_HOST: 0.0.0.0
      EVEJS_MICROSERVICES_PORT: ${EVEJS_MICROSERVICES_PORT:-26002}
      EVEJS_MICROSERVICES_PUBLIC_URL: "${EVEJS_MICROSERVICES_PUBLIC_URL:-http://127.0.0.1:${EVEJS_MICROSERVICES_PORT:-26002}/}"
      EVEJS_PROXY_LOCAL_INTERCEPT: "1"
      EVEJS_PROXY_LOOPBACK_CDN_LISTEN_PORT: "26003"
      EVEJS_REDSHIFT_MONITOR_HOST: 0.0.0.0
      EVEJS_REDSHIFT_MONITOR_PORT: ${EVEJS_REDSHIFT_MONITOR_PORT:-26400}
      EVEJS_XMPP_CONNECT_HOST: localhost
      EVEJS_XMPP_SERVER_BIND_HOST: 0.0.0.0
      # The browser companion's shared secret. See "Browser companion" in
      # README.md: the /_evejs-web/v1 gateway grants token-less access ONLY to
      # peers whose socket address is 127.0.0.1, and a container's peer is never
      # loopback. Empty (the default) leaves the gateway loopback-only, which is
      # correct when nothing outside this container talks to it.
      EVEJS_WEB_GATEWAY_TOKEN: ${EVEJS_WEB_GATEWAY_TOKEN:-}
    networks:
      default:
        aliases:
          # A stable DNS name for sibling compose projects on evejs-net. The
          # service is called `server`, which is too generic to rely on from
          # another project's containers.
          - evejs-server
    volumes:
      - evejs-data:/var/lib/evejs
      # Application logs and Node diagnostic reports must survive image rebuilds
      # and container replacement so disconnect incidents remain inspectable. The
      # server writes them under the data root (EVEJS_DATA_ROOT/logs); this keeps
      # them in their own volume, as before.
      - evejs-logs:/var/lib/evejs/logs
      # Keep configuration outside the image so ConfigEditor changes only need
      # a container restart, not a rebuild. The server owns first-run seeding.
      - ./config:/app/config
      # The gameStore lives in the evejs-data volume, where the init service
      # builds it. Do NOT bind-mount ./_local/gameStore over it: init does not
      # share that mount, so a fresh install boots an empty universe (or
      # SQLITE_CANTOPEN on a root-owned auto-created dir). The ConfigEditor
      # auto-detects the volume layout and needs no host mount.
      # Alliance logos imported via the ConfigEditor land here on the host and
      # are served live by the image server (see tools/ConfigEditor alliance-logo-*).
      - ./server/src/_secondary/image/generated/Alliance:/app/server/src/_secondary/image/generated/Alliance
      # The server keeps its TLS certificates in the data root's certs folder.
      # Mounting the host's _local/certs there gives the host and the container
      # one CA: the certificate installer (Install-EvEJSCerts.ps1) makes it on
      # the host and has the client trust it, and the server uses it here.
      - ./_local/certs:/var/lib/evejs/certs
      # Where the certificates were before 2026-09-21, read only. At startup the
      # server copies any file _local/certs does not have yet from these, so an
      # install that already had a CA keeps it.
      - ./server/certs:/app/server/certs:ro
      - ./server/src/_secondary/express/certs:/app/server/src/_secondary/express/certs:ro
    ports:
      - "127.0.0.1:443:26003"
      - "127.0.0.1:5222:5222"
      - "127.0.0.1:${EVEJS_SERVER_PORT:-26000}:${EVEJS_SERVER_PORT:-26000}"
      - "127.0.0.1:${EVEJS_IMAGE_SERVER_PORT:-26001}:${EVEJS_IMAGE_SERVER_PORT:-26001}"
      - "127.0.0.1:${EVEJS_MICROSERVICES_PORT:-26002}:${EVEJS_MICROSERVICES_PORT:-26002}"
      - "127.0.0.1:${EVEJS_REDSHIFT_MONITOR_PORT:-26400}:${EVEJS_REDSHIFT_MONITOR_PORT:-26400}"
    healthcheck:
      test: ["CMD", "node", "/app/server/src/utils/deploymentHealthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 2m
    stop_grace_period: 45s

networks:
  # Named explicitly (instead of the generated `evejs_default`) so the browser
  # companion in ../evejs-web-poc can attach its own container to this same
  # bridge and reach the gateway by DNS. Container-to-container traffic never
  # touches a published host port, so the loopback-only publishing rule at the
  # top of README.md stays intact.
  default:
    name: evejs-net

volumes:
  evejs-data:
    name: evejs-data
  evejs-logs:
    name: evejs-logs
